<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificador de Herói</title>
    <link rel="stylesheet" href="./src/assets/reset.css">
    <link rel="stylesheet" href="./src/assets/styles.css">
</head>
<body>
    <header>
        <div class="title">
            <h1>Classificador de Herói</h1>
        </div>
    </header>
    <main>
        <div class="content">
            <p>Abaixo poderás inserir o <span id="nome">nome</span> e quantidade de <span id="xp">XP</span> do seu herói para classificá-lo e receber um título de acordo com o XP</p>
        </div>
        <div id="hero-classifier">
            <div id="data">
                <h3>
                    avalie aqui
                </h3>
                <form autocomplete="off">
                    <p><label for="hero-name">Nome do herói: </label><input class="field" type="text" id="hero-name" placeholder="insira o nome" required maxlength="40"></p>
                    <p><label for="hero-xp">Quantidade de XP atual: </label><input class="field" type="number" id="hero-xp" min="0" placeholder="XP" required></p>
                    <div class="position"><button type="submit">Classificar</button></div> 
                </form>
            </div>
        </div>
    </main>
    <footer>
        <div id="foot">
            <h4>made by <a href="https://github.com/kevinsoarespaiva" target="_blank">Kevin Soares</a></h4>
        </div>
    </footer>
</body>
</html>
